name: Core conformance
on:
  push:
  pull_request:
jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: conformance/requirements.txt
      - run: python -m pip install -r conformance/requirements.txt
      - run: python conformance/check_release.py
      - run: python conformance/validate.py examples/core-project
